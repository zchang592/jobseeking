name: Publish music job radar

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch new announcements before publishing
        type: boolean
        default: false
  schedule:
    - cron: '30 0 * * *' # 08:30 Asia/Shanghai

concurrency:
  group: music-job-radar-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore public crawl history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pages-state/verified.json
          key: radar-public-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-public-v1-
      - name: Select verified snapshot
        run: |
          mkdir -p .pages-state
          if [ ! -f .pages-state/verified.json ]; then
            cp data/verified.json .pages-state/verified.json
          fi
      - name: Refresh public sources
        id: refresh
        if: github.event_name == 'schedule' || inputs.refresh
        continue-on-error: true
        timeout-minutes: 14
        run: |
          python -m pip install -r requirements.txt
          python -m scripts.refresh_pages --snapshot .pages-state/verified.json
      - name: Build static catalogue
        run: |
          python -m unittest discover -s tests -p test_pages.py
          python scripts/build_pages.py --snapshot .pages-state/verified.json --output .pages-dist
      - name: Retain refreshed public snapshot
        if: steps.refresh.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pages-state/verified.json
          key: radar-public-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: release
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
