name: music-job-radar
x-backend: &backend
  build: .
  image: music-job-radar-backend:local
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:?run scripts/configure.py}@db:5432/radar
    RADAR_DATA: /var/lib/radar
  volumes:
    - radar-state:/var/lib/radar
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/configure.py}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 4s
      retries: 20
  api:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8170/health',timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 30
  worker:
    <<: *backend
    command: ["python","-m","radar.worker"]
    depends_on:
      api:
        condition: service_healthy
  web:
    build: ./web
    restart: unless-stopped
    environment:
      RADAR_API_URL: http://api:8170
    ports:
      - "127.0.0.1:${RADAR_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
  radar-state:
